    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdfa;

            margin: 0;
            padding: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .arabic-text {
            font-family: 'Amiri', serif;
            direction: rtl;
        }
        .bg-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2314b8a6' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .btn {
            transition: all 0.2s ease;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .card-hover {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .hidden-screen {
            display: none !important;
        }
        
        /* Custom Animations */
        @keyframes bounceIn {
            0% { transform: scale(0.1); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-bounce-in {
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.5s;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        /* Option Button Styles */
        .option-btn {
            background-color: white;
            border: 2px solid #e2e8f0;
            border-radius: 1rem;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .option-btn:hover {
            border-color: #3b82f6;
            background-color: #eff6ff;
            transform: translateY(-2px);
        }
        .option-btn.selected {
            border-color: #3b82f6;
            background-color: #dbeafe;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }
        .option-btn.correct {
            border-color: #22c55e;
            background-color: #dcfce7;
            color: #166534;
        }
        .option-btn.wrong {
            border-color: #ef4444;
            background-color: #fee2e2;
            color: #991b1b;
        }
        
        /* Progress Bar */
        .progress-bar-container {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 9999px;
            height: 0.75rem;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background-color: #3b82f6;
            transition: width 0.3s ease;
        }

        /* Score Badge */
        .score-badge {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(245, 158, 11, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Star Rating */
        .star-rating {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            font-size: 3rem;
            color: #cbd5e1;
            margin: 1rem 0;
        }
        .star-rating .filled {
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }

        /* Drop Zone */
        .drop-zone {
            min-height: 60px;
            border: 2px dashed #94a3b8;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
            transition: background-color 0.2s;
        }
        .drop-zone.drag-over {
            background-color: #e2e8f0;
            border-color: #3b82f6;
        }
        .draggable-item {
            cursor: grab;
        }
        .draggable-item:active {
            cursor: grabbing;
        }
    </style>
</head>

                { type: 'match-pic', visual: '💇', questionMy: "Pilih gambar 'شَعْرٌ'.", options: ["👄", "👃", "💇", "💪"], answer: 2, isEmoji: true },

                { type: 'mcq', visual: '🦋', questionMy: "Pilih perkataan yang bermula dengan huruf 'ف'.", options: ["فَرَاشَةٌ", "طَبِيبٌ", "قِطَارٌ", "وَرَقَةٌ"], answer: 0, arabicOptions: true },

                { type: 'mcq', visual: '🖊️👝', questionMy: "Ayat 'القَلَمُ فِي المِقْلَمَةِ' menggunakan kata sendi 'فِي' yang bermaksud:", options: ["Di atas", "Di bawah", "Di dalam", "Di hadapan"], answer: 2 },
                { type: 'fill-blank', visual: '📓', questionMy: "Huruf yang hilang: دَ فْ _ رٌ. (Buku tulis)", options: ["تَ", "طَ", "ثَ", "صَ"], answer: 0, arabicOptions: true },
                { type: 'mcq', visual: '🥪', questionMy: "Perkataan 'مَقْصَفٌ' bermaksud:", options: ["Kantin", "Perpustakaan", "Kelas", "Tandas"], answer: 0 },
                { type: 'mcq', visual: '🐒', questionMy: "Pilih huruf 'ق' yang berbaris dhommah (depan).", options: ["قَلَمٌ", "قِطَارٌ", "قُرُودٌ", "بَقَرَةٌ"], answer: 2, arabicOptions: true },
                { type: 'match-pic', visual: '✏️', questionMy: "Pilih 'قَلَمُ رَصَاصٍ' (Pensel).", options: ["🖋️", "✏️", "🖍️", "📏"], answer: 1, isEmoji: true },
                { type: 'mcq', visual: '📖', questionMy: "Jawapan yang sesuai untuk 'مَا هَذَا؟' jika merujuk kepada buku:", options: ["هَذَا قَلَمٌ", "هَذِهِ مِمْحَاةٌ", "هَذَا كِتَابٌ", "هَذِهِ حَقِيبَةٌ"], answer: 2, arabicOptions: true }
            ]
        };

        // Combine all questions for exams
        const allQuestions = [...questionBank.unit1, ...questionBank.unit2, ...questionBank.unit3, ...questionBank.unit4];

        // Shuffle function
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Generate Exam Sets (30 unique questions each)
        let shuffledAll = shuffleArray([...allQuestions]);
        const examSet1 = shuffledAll.slice(0, 30);
        // Reshuffle to ensure sets are different, though they draw from the same 80-question pool
        shuffledAll = shuffleArray([...allQuestions]);
        const examSet2 = shuffledAll.slice(0, 30);

        // State Management
        let currentState = {
            screen: 'home', // home, unit-menu, quiz, exam, result
            currentUnit: null,
            currentQuizSet: [],
            currentQuestionIndex: 0,
            score: 0,
            progress: loadProgress()
        };

        function saveProgress(unitId, score) {
            if(!currentState.progress[unitId] || currentState.progress[unitId] < score) {
                currentState.progress[unitId] = score;
                localStorage.setItem('bArabTahun2Progress', JSON.stringify(currentState.progress));
            }
        }

        function loadProgress() {
            const saved = localStorage.getItem('bArabTahun2Progress');
            return saved ? JSON.parse(saved) : {};
        }

    </script>

    <script>
        // --- Navigation Logic ---
        function navigate(screenId) {
            document.querySelectorAll('main > div > div').forEach(el => el.classList.add('hidden-screen'));
            document.getElementById(`screen-${screenId}`).classList.remove('hidden-screen');
            document.getElementById(`screen-${screenId}`).classList.add('animate-bounce-in');
            
            if(screenId === 'home') renderHome();
            window.scrollTo(0, 0);
        }

        // --- Render Home Menu ---
        function renderHome() {
            const container = document.getElementById('unit-buttons-container');
            container.innerHTML = '';
            
            units.forEach(unit => {
                const bestScore = currentState.progress[`unit${unit.id}`] || 0;
                const btn = document.createElement('button');
                btn.className = `btn card-hover bg-gradient-to-br ${unit.color} text-white rounded-2xl p-4 text-left shadow-md flex flex-col justify-between h-32 relative overflow-hidden group`;
                btn.onclick = () => startQuiz(`unit${unit.id}`, unit.titleMy);
                
                btn.innerHTML = `
                    <div class="absolute -right-4 -bottom-4 opacity-20 transform group-hover:scale-110 transition-transform">
                        <i class="fas ${unit.icon} text-8xl"></i>
                    </div>
                    <div class="relative z-10">
                        <div class="font-bold text-lg mb-1">${unit.titleMy}</div>
                        <div class="arabic-text text-xl">${unit.title}</div>
                    </div>
                    <div class="relative z-10 text-sm font-semibold bg-white/20 inline-block px-2 py-1 rounded self-start mt-auto">
                        Skor Terbaik: ${bestScore}/20
                    </div>
                `;
                container.appendChild(btn);
            });
        }

        // --- Quiz Logic ---
        let isAnswered = false;

        function startQuiz(unitKey, unitName) {
            currentState.currentUnit = unitKey;
            // Get 20 questions for the unit and shuffle
            currentState.currentQuizSet = shuffleArray([...questionBank[unitKey]]).slice(0, 20);
            currentState.currentQuestionIndex = 0;
            currentState.score = 0;
            
            document.getElementById('quiz-title').innerText = `Latihan: ${unitName}`;
            navigate('quiz');
            loadQuestion();
        }

        function startExam(setNum) {
            currentState.currentUnit = `exam${setNum}`;
            currentState.currentQuizSet = setNum === 1 ? [...examSet1] : [...examSet2];
            currentState.currentQuestionIndex = 0;
            currentState.score = 0;
            
            document.getElementById('quiz-title').innerText = `Peperiksaan Set ${setNum}`;
            navigate('quiz');
            loadQuestion();
        }

        function retryCurrent() {
            if(currentState.currentUnit.startsWith('unit')) {
                startQuiz(currentState.currentUnit, units.find(u => `unit${u.id}` === currentState.currentUnit).titleMy);
            } else {
                startExam(parseInt(currentState.currentUnit.replace('exam', '')));
            }
        }

        function loadQuestion() {
            isAnswered = false;
            document.getElementById('btn-next').classList.add('hidden');
            const feedbackArea = document.getElementById('feedback-area');
            feedbackArea.className = 'mt-6 h-12 flex items-center justify-center font-bold text-lg rounded-xl opacity-0 transition-opacity duration-300';
            
            const qIndex = currentState.currentQuestionIndex;
            const totalQ = currentState.currentQuizSet.length;
            const qData = currentState.currentQuizSet[qIndex];
            
            // Update Headers
            document.getElementById('question-counter').innerText = `Soalan ${qIndex + 1} / ${totalQ}`;
            document.getElementById('current-score').innerText = currentState.score;
            document.getElementById('progress-bar').style.width = `${((qIndex) / totalQ) * 100}%`;

            const container = document.getElementById('question-container');
            container.innerHTML = '';
            container.classList.remove('animate-shake');

            // Render Visual Element (Emoji/Icon) if it exists
            if (qData.visual) {
                const visualWrapper = document.createElement('div');
                visualWrapper.className = "flex justify-center mb-6 animate-float";
                
                const visualEl = document.createElement('div');
                visualEl.className = "w-32 h-32 sm:w-40 sm:h-40 bg-gradient-to-br from-teal-50 to-white rounded-full flex items-center justify-center text-7xl sm:text-8xl shadow-lg border-4 border-teal-200 text-teal-600";
                visualEl.innerHTML = qData.visual;
                
                visualWrapper.appendChild(visualEl);
                container.appendChild(visualWrapper);
            }

            // Render Question Text
            const qTitle = document.createElement('h4');
            qTitle.className = "text-2xl font-bold text-gray-700 mb-6";
            qTitle.innerText = qData.questionMy;
            container.appendChild(qTitle);

            if (qData.arabicContext) {
                const ctx = document.createElement('div');
                ctx.className = "arabic-text text-4xl text-teal-600 mb-6 bg-teal-50 p-4 rounded-xl border border-teal-100";
                ctx.innerText = qData.arabicContext;
                container.appendChild(ctx);
            }

            // Render Options based on type
            if (qData.type === 'mcq' || qData.type === 'fill-blank' || qData.type === 'match-pic') {
                const optionsGrid = document.createElement('div');
                optionsGrid.className = "grid grid-cols-1 sm:grid-cols-2 gap-4 w-full";
                
                qData.options.forEach((opt, index) => {
                    const btn = document.createElement('button');
                    btn.className = "option-btn text-xl font-semibold";
                    
                    if(qData.arabicOptions) {
                        btn.classList.add('arabic-text', 'text-3xl');
                    }
                    if(qData.isEmoji) {
                        btn.classList.add('text-5xl', 'py-6');
                    }

                    btn.innerText = opt;
                    btn.onclick = () => handleAnswer(index, btn);
                    optionsGrid.appendChild(btn);
                });
                container.appendChild(optionsGrid);
            } 
            else if (qData.type === 'arrange-words') {
                 // Drag and Drop (simplified to click to select order for better mobile compatibility)
                 const dropArea = document.createElement('div');
                 dropArea.className = "flex flex-wrap justify-center gap-2 mb-6 min-h-[60px] p-4 bg-gray-50 rounded-xl border-2 border-dashed border-gray-300 w-full";
                 dropArea.id = "arrange-drop-area";
                 
                 const wordsArea = document.createElement('div');
                 wordsArea.className = "flex flex-wrap justify-center gap-2 w-full";
                 
                 let selectedOrder = [];
                 
                 qData.words.forEach((word, index) => {
                     const btn = document.createElement('button');
                     btn.className = "btn bg-white border-2 border-blue-200 shadow-sm rounded-lg px-4 py-2 text-2xl arabic-text hover:border-blue-500 transition-colors";
                     btn.innerText = word;
                     btn.onclick = function() {
                         if(isAnswered) return;
                         if(this.parentElement === wordsArea) {
                             dropArea.appendChild(this);
                             selectedOrder.push(index);
                         } else {
                             wordsArea.appendChild(this);
                             selectedOrder = selectedOrder.filter(i => i !== index);
                         }
                     };
                     wordsArea.appendChild(btn);
                 });
                 
                 container.appendChild(dropArea);
                 container.appendChild(wordsArea);

                 const checkBtn = document.createElement('button');
                 checkBtn.className = "mt-6 btn bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-xl font-bold";
                 checkBtn.innerText = "Semak Jawapan";
                 checkBtn.onclick = () => {
                     if(selectedOrder.length !== qData.words.length) {
                         alert("Sila susun semua perkataan.");
                         return;
                     }
                     const isCorrect = JSON.stringify(selectedOrder) === JSON.stringify(qData.correctOrder);
                     handleAnswerMatchArrangement(isCorrect, checkBtn);
                 };
                 container.appendChild(checkBtn);
            }
            else if (qData.type === 'match-text') {
                // Simplified matching: Click left, then right
                const matchContainer = document.createElement('div');
                matchContainer.className = "flex w-full justify-between gap-4";
                
                const leftCol = document.createElement('div');
                leftCol.className = "flex flex-col gap-4 w-1/2";
                const rightCol = document.createElement('div');
                rightCol.className = "flex flex-col gap-4 w-1/2";

                let selectedLeft = null;
                let matches = 0;
                let shuffledRight = shuffleArray([...qData.pairs.map((p,i)=>({t:p.a, i:i}))]);

                qData.pairs.forEach((pair, index) => {
                    // Left button
                    const lBtn = document.createElement('button');
                    lBtn.className = "btn bg-white border-2 border-gray-200 rounded-xl p-3 text-xl arabic-text shadow-sm hover:border-blue-400";
                    lBtn.innerText = pair.q;
                    lBtn.onclick = () => {
                        if(isAnswered || lBtn.disabled) return;
                        if(selectedLeft) selectedLeft.classList.remove('border-blue-500', 'bg-blue-50');
                        selectedLeft = lBtn;
                        selectedLeft.dataset.index = index;
                        selectedLeft.classList.add('border-blue-500', 'bg-blue-50');
                    };
                    leftCol.appendChild(lBtn);
                });

                shuffledRight.forEach(item => {
                     // Right button
                    const rBtn = document.createElement('button');
                    rBtn.className = "btn bg-white border-2 border-gray-200 rounded-xl p-3 text-lg font-semibold shadow-sm hover:border-blue-400";
                    rBtn.innerText = item.t;
                    rBtn.onclick = () => {
                        if(isAnswered || rBtn.disabled || !selectedLeft) return;
                        
                        if(parseInt(selectedLeft.dataset.index) === item.i) {
                            // Match
                            selectedLeft.classList.replace('border-blue-500', 'border-green-500');
                            selectedLeft.classList.replace('bg-blue-50', 'bg-green-100');
                            rBtn.classList.replace('border-gray-200', 'border-green-500');
                            rBtn.classList.add('bg-green-100');
                            selectedLeft.disabled = true;
                            rBtn.disabled = true;
                            selectedLeft = null;
                            matches++;
                            
                            if(matches === qData.pairs.length) {
                                handleAnswerMatchArrangement(true, null);
                            }
                        } else {
                            // Wrong match
                            const fb = document.getElementById('feedback-area');
                            fb.innerText = "Salah padanan, cuba lagi.";
                            fb.className = 'mt-6 h-12 flex items-center justify-center font-bold text-lg rounded-xl opacity-100 bg-red-100 text-red-600 transition-opacity duration-300';
                            container.classList.add('animate-shake');
                            setTimeout(() => {
                                container.classList.remove('animate-shake');
                                fb.classList.remove('opacity-100');
                            }, 1000);
                        }
                    };
                    rightCol.appendChild(rBtn);
                });

                matchContainer.appendChild(leftCol);
                matchContainer.appendChild(rightCol);
                container.appendChild(matchContainer);
            }
        }

        // --- Handle Answers ---
        function handleAnswer(selectedIndex, btnElement) {
            if(isAnswered) return;
            isAnswered = true;
            
            const qData = currentState.currentQuizSet[currentState.currentQuestionIndex];
            const isCorrect = selectedIndex === qData.answer;
            
            const options = document.querySelectorAll('.option-btn');
            
            if(isCorrect) {
                btnElement.classList.add('correct');
                currentState.score++;
                document.getElementById('current-score').innerText = currentState.score;
                showFeedback(true);
            } else {
                btnElement.classList.add('wrong');
                options[qData.answer].classList.add('correct'); // Show correct answer
                showFeedback(false);
                document.getElementById('question-container').classList.add('animate-shake');
            }

            options.forEach(opt => opt.style.pointerEvents = 'none');
            document.getElementById('btn-next').classList.remove('hidden');
        }

        function handleAnswerMatchArrangement(isCorrect, btnElement) {
            if(isAnswered) return;
            isAnswered = true;
            if(btnElement) btnElement.style.display = 'none';

            if(isCorrect) {
                currentState.score++;
                document.getElementById('current-score').innerText = currentState.score;
                showFeedback(true);
            } else {
                showFeedback(false);
                document.getElementById('question-container').classList.add('animate-shake');
            }
            document.getElementById('btn-next').classList.remove('hidden');
        }

        function showFeedback(isCorrect) {
            const feedbackArea = document.getElementById('feedback-area');
            if(isCorrect) {
                feedbackArea.innerHTML = '<i class="fas fa-check-circle mr-2"></i> Tepat Sekali!';
                feedbackArea.className = 'mt-6 h-12 flex items-center justify-center font-bold text-lg rounded-xl bg-green-100 text-green-700 opacity-100 transition-opacity duration-300';
            } else {
                feedbackArea.innerHTML = '<i class="fas fa-times-circle mr-2"></i> Kurang Tepat.';
                feedbackArea.className = 'mt-6 h-12 flex items-center justify-center font-bold text-lg rounded-xl bg-red-100 text-red-700 opacity-100 transition-opacity duration-300';
            }
        }

        function nextQuestion() {
            currentState.currentQuestionIndex++;
            if(currentState.currentQuestionIndex < currentState.currentQuizSet.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            const totalQ = currentState.currentQuizSet.length;
            document.getElementById('progress-bar').style.width = '100%';
            
            // Save progress if it's a unit (not exam)
            if(currentState.currentUnit.startsWith('unit')) {
                saveProgress(currentState.currentUnit, currentState.score);
            }

            // Setup Result Screen
            document.getElementById('final-score').innerText = `${currentState.score} / ${totalQ}`;
            
            const percentage = (currentState.score / totalQ) * 100;
            const stars = document.getElementById('result-stars');
            stars.innerHTML = '';
            
            let numStars = 0;
            let msg = "";
            let icon = "";
            
            if (percentage >= 80) { numStars = 3; msg = "Syabas! Pencapaian cemerlang."; icon = "🌟"; }
            else if (percentage >= 50) { numStars = 2; msg = "Bagus! Teruskan usaha."; icon = "👍"; }
            else { numStars = 1; msg = "Cuba lagi, anda pasti boleh!"; icon = "💪"; }
            
            document.getElementById('result-msg').innerText = msg;
            document.getElementById('result-icon').innerText = icon;

            for(let i=0; i<3; i++) {
                if(i < numStars) stars.innerHTML += '<i class="fas fa-star filled"></i>';
                else stars.innerHTML += '<i class="fas fa-star"></i>';
            }

            setTimeout(() => {
                navigate('result');
            }, 500);
        }

        // --- Initialization ---
        window.onload = () => {
            renderHome();
        };

    </script>
</body>
</html>
